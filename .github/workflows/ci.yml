name: CI

on:
  push:
    branches: [main]
    tags: ['ch[0-9][0-9]', 'ch[0-9][0-9]-r*', 'final']
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly run against the pinned versions catches newly published vulnerabilities.
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MasteringAI.slnx

      - name: Build
        run: dotnet build MasteringAI.slnx --configuration Release --no-restore

      - name: Test
        # Tests that call a real model are marked [Trait("Category", "Live")] and are skipped in CI.
        run: dotnet test --solution MasteringAI.slnx --configuration Release --no-build

      - name: Check for vulnerable packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet list MasteringAI.slnx package --vulnerable --include-transitive | tee vuln.txt
          if grep -q -E "Critical|High|Moderate|Low" vuln.txt; then
            echo "::error::Vulnerable packages found"; exit 1
          fi

  rag-eval:
    # Live checks against a real local model (Ollama). Chapter 2: streaming latency.
    # CPU only, so it takes several minutes.
    name: Live model checks (Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PRIORAUTHBOT_TEST_OLLAMA: http://localhost:11434
      PRIORAUTHBOT_TEST_CHAT_MODEL: llama3.2:3b
      PRIORAUTHBOT_TEST_REPORTS: ${{ github.workspace }}/eval-reports
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Installed on the runner rather than as a service container: in a container on the hosted
      # runner, Ollama ran inference on a single thread and every answer took minutes.
      - name: Install Ollama and pull the models
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.40.16 sh
          # The hosted runner has no systemd, so the installer cannot start the service.
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          curl -sf http://localhost:11434/api/version || { cat "$RUNNER_TEMP/ollama.log"; exit 1; }
          ollama pull "$PRIORAUTHBOT_TEST_CHAT_MODEL"
          df -h /
          free -h

      - name: Stream one reply and time it (chapter 2)
        if: always()
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-class "PriorAuthBot.Tests.LiveChatTests" --output Detailed

      - name: Add the reports to the job summary
        if: always()
        run: |
          cat eval-reports/*.md || true
          cat eval-reports/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-eval-reports
          path: eval-reports/
