name: CI

on:
  push:
    branches: [main]
    tags: ['ch[0-9][0-9]', 'ch[0-9][0-9]-r*', 'final']
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly run against the pinned versions catches newly published vulnerabilities.
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MasteringAI.slnx

      - name: Build
        run: dotnet build MasteringAI.slnx --configuration Release --no-restore

      - name: Test
        # Tests that call a real model are marked [Trait("Category", "Live")] and are skipped in CI.
        run: dotnet test --solution MasteringAI.slnx --configuration Release --no-build

      - name: Eval gate, offline (chapter 9)
        # Retrieval on all 105 golden questions, chapter 7 against chapter 8, the leak checks on
        # every retrieval, prompt, and answer, chapter 10's tool cases, chapter 11's agent cases,
        # chapter 12's red-team attacks (with and without the guardrails), chapter 13's audit, telemetry,
        # cost, and answer cache checks, and the gate against eval/baselines.json.
        if: matrix.os == 'ubuntu-latest'
        run: >-
          dotnet run --project eval/PriorAuthBot.Eval --configuration Release --no-build
          -- --provider Offline --answers --tools --agents --redteam --ops --out eval-reports

      - name: Add the eval reports to the job summary
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          cat eval-reports/*.md || true
          cat eval-reports/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Check for vulnerable packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet list MasteringAI.slnx package --vulnerable --include-transitive | tee vuln.txt
          if grep -q -E "Critical|High|Moderate|Low" vuln.txt; then
            echo "::error::Vulnerable packages found"; exit 1
          fi

  pgvector:
    name: Integration (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    # Chapter 9: the tests start pgvector themselves with Testcontainers (the runner has Docker), so
    # the same command works on a laptop: PRIORAUTHBOT_TEST_TESTCONTAINERS=true dotnet test ...
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PRIORAUTHBOT_TEST_TESTCONTAINERS: true
      PRIORAUTHBOT_TEST_REPORTS: ${{ github.workspace }}/eval-reports
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test against pgvector
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-class "PriorAuthBot.Tests.PostgresIntegrationTests" --output Detailed

      - name: The append-only audit table (chapter 13)
        if: always()
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-class "PriorAuthBot.Tests.Observability.PostgresAuditStoreTests" --output Detailed

      - name: Filtered search experiment (chapter 6)
        if: always()
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-method "PriorAuthBot.Tests.FilteredSearchExperiment.Pgvector" --output Detailed

      - name: The shared token ledger, the migration's privileges, and the smoke test (chapter 14)
        if: always()
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-class "PriorAuthBot.Tests.Deployment.PostgresDeploymentTests"
          --filter-class "PriorAuthBot.Tests.Deployment.SmokeTestTests" --output Detailed

      - name: Add the reports to the job summary
        if: always()
        run: |
          cat eval-reports/*.md || true
          cat eval-reports/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  qdrant:
    # Chapter 6: the same permission tests against a second store, chosen by configuration.
    name: Integration (Qdrant)
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports: ['6333:6333', '6334:6334']
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PRIORAUTHBOT_TEST_QDRANT: localhost:6334
      PRIORAUTHBOT_TEST_REPORTS: ${{ github.workspace }}/eval-reports
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Wait for Qdrant
        run: for i in $(seq 1 30); do curl -sf http://localhost:6333/readyz && break; sleep 2; done

      - name: Test against Qdrant
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-class "PriorAuthBot.Tests.QdrantIntegrationTests" --output Detailed

      - name: Filtered search experiment (chapter 6)
        if: always()
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-method "PriorAuthBot.Tests.FilteredSearchExperiment.Qdrant" --output Detailed

      - name: Add the reports to the job summary
        if: always()
        run: |
          cat eval-reports/*.md || true
          cat eval-reports/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  rag-eval:
    # Chapter 7: the golden set against a real local model (Ollama), plus one groundedness check
    # with Microsoft.Extensions.AI.Evaluation. Chapter 2: streaming latency. Chapter 3: the labeled
    # classification questions.
    # Chapter 8: hybrid search, reranking (a local cross-encoder and the LLM), query rewriting, and
    # citation faithfulness.
    # Chapter 9: the eval project, with LLM judges on a sample of answers, a response cache carried
    # between runs, an HTML report, and the regression gate. The golden set check moved there.
    # Chapter 10: the tool cases, with the formulary MCP server in process, against the chat model.
    # Chapter 12: the red-team attacks against the chat model, with the guardrails and without them.
    # Chapter 13: tokens and cost per answer from the model's own usage, and the answer cache's
    # similarity threshold measured with the real embedding model.
    # CPU only, so it takes a long time.
    name: RAG eval (golden set on Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PRIORAUTHBOT_TEST_OLLAMA: http://localhost:11434
      PRIORAUTHBOT_TEST_CHAT_MODEL: llama3.2:3b
      PRIORAUTHBOT_TEST_EMBEDDING_MODEL: nomic-embed-text:v1.5
      PRIORAUTHBOT_TEST_VISION_MODEL: qwen2.5vl:3b
      # llama3.2:3b could not follow the groundedness evaluator's output format (2 of 13 scored).
      PRIORAUTHBOT_TEST_JUDGE_MODEL: qwen2.5:7b
      PRIORAUTHBOT_TEST_REPORTS: ${{ github.workspace }}/eval-reports
      PRIORAUTHBOT_TEST_RERANKER: ${{ github.workspace }}/models/ms-marco-MiniLM-L6-v2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download the cross-encoder reranker (chapter 8)
        run: scripts/get-reranker.sh "$PRIORAUTHBOT_TEST_RERANKER"

      # Installed on the runner rather than as a service container: in a container on the hosted
      # runner, Ollama ran inference on a single thread and every answer took minutes.
      # Four models need about 11 GB, more than the hosted runner has free by default. When the disk
      # filled, the runner itself died partway through the golden set and left no logs.
      - name: Free disk space for the models
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Install Ollama and pull the models
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.40.16 sh
          # The hosted runner has no systemd, so the installer cannot start the service.
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          curl -sf http://localhost:11434/api/version || { cat "$RUNNER_TEMP/ollama.log"; exit 1; }
          ollama pull "$PRIORAUTHBOT_TEST_EMBEDDING_MODEL"
          ollama pull "$PRIORAUTHBOT_TEST_CHAT_MODEL"
          ollama pull "$PRIORAUTHBOT_TEST_JUDGE_MODEL"
          ollama pull "$PRIORAUTHBOT_TEST_VISION_MODEL"
          df -h /
          free -h

      # Answers, embeddings, and judge replies from earlier runs. An entry is keyed by its exact
      # request, so a changed prompt or model simply misses; restoring the newest cache is always safe.
      - name: Restore the eval cache (chapter 9)
        uses: actions/cache/restore@v4
        with:
          path: .eval-cache
          key: eval-cache-${{ github.run_id }}
          restore-keys: eval-cache-

      # Chapter 15: the weights Ollama pulled, checked against models.lock.json. Tags are names, not
      # versions: a tag can point at new weights tomorrow. An entry with no digest yet is recorded and
      # printed for review (commit it); a digest that differs from the lock fails the job.
      - name: Check the pulled models against models.lock.json (chapter 15)
        run: |
          python3 scripts/get-model.py --record-ollama http://localhost:11434
          git diff models.lock.json || true
          dotnet run --project eval/PriorAuthBot.Eval --configuration Release -- --verify-models \
            --ollama "$PRIORAUTHBOT_TEST_EMBEDDING_MODEL" --ollama "$PRIORAUTHBOT_TEST_CHAT_MODEL" \
            --ollama "$PRIORAUTHBOT_TEST_JUDGE_MODEL" --ollama "$PRIORAUTHBOT_TEST_VISION_MODEL"

      - name: Eval suite with LLM judges, tool, agent, red-team, and operations cases, and the regression gate (chapters 9 to 15)
        # Chapter 15: --latency times 8 answers with no cache, for the model comparison.
        run: >-
          dotnet run --project eval/PriorAuthBot.Eval --configuration Release
          -- --provider Ollama --answers --tools --agents --redteam --ops --latency 8 --execution ${{ github.sha }}

      - name: Save the eval cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .eval-cache
          key: eval-cache-${{ github.run_id }}

      - name: Chunking experiment (chapter 7)
        if: always()
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-class "PriorAuthBot.Tests.LiveRagTests" --output Detailed

      - name: Stream one reply and time it (chapter 2)
        if: always()
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-class "PriorAuthBot.Tests.LiveChatTests" --output Detailed

      - name: Classify the labeled questions (chapter 3)
        if: always()
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-class "PriorAuthBot.Tests.LiveClassifierTests" --output Detailed

      - name: Search the policy catalog with embeddings (chapter 5)
        if: always()
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-class "PriorAuthBot.Tests.LiveSemanticSearchTests" --output Detailed

      - name: Hybrid search, reranking, and query rewriting (chapter 8)
        if: always()
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-class "PriorAuthBot.Tests.LiveHybridSearchTests" --output Detailed

      # The vision model is the last of four Ollama models to load, on a runner with about 8 GB of memory. In two
      # runs on PR #8 the runner shut down and then Ollama stopped during that step, with every earlier
      # step green.
      # Unload the other models first, and restart Ollama if it has already gone.
      - name: Unload the other models before the vision model
        if: always()
        run: |
          free -h
          if ! curl -sf http://localhost:11434/api/version > /dev/null; then
            echo "Ollama is not running. The end of its log:"
            tail -n 50 "$RUNNER_TEMP/ollama.log" || true
            sudo dmesg | grep -i -E "out of memory|oom" | tail -n 5 || true
            nohup ollama serve >> "$RUNNER_TEMP/ollama.log" 2>&1 &
            for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          fi
          for model in $(ollama ps | awk 'NR > 1 { print $1 }'); do ollama stop "$model"; done
          free -h

      - name: Read scans with a vision model (chapter 4)
        if: always()
        run: >-
          dotnet test --project tests/PriorAuthBot.Tests --configuration Release
          -- --filter-class "PriorAuthBot.Tests.LiveIntakeTests" --output Detailed

      - name: Show the Ollama log if a step failed
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/ollama.log" || true

      - name: Add the reports to the job summary
        if: always()
        run: |
          cat eval-reports/*.md || true
          cat eval-reports/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-eval-reports
          path: eval-reports/

  # ---- Chapter 14: the supply-chain and deployment gates. The new jobs pin every action and tool
  # image by SHA or digest, as the deploy workflow does.

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The whole history, not only the last commit: a secret deleted in a later commit is still
      # in the repository and still has to be rotated.
      - name: gitleaks over every commit
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config .gitleaks.toml --redact --verbose --report-format json --report-path gitleaks.json /repo
          echo "Commits scanned: $(git rev-list --count HEAD), findings: $(jq length gitleaks.json)" | tee -a "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency review
    # Needs the repository's dependency graph (Settings > Code security > Dependency graph). Turn it
    # on, then set the repository variable DEPENDENCY_REVIEW to true; until then the job is skipped,
    # and the nightly vulnerable-package check in "Build and test" still covers known advisories.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Fails a pull request that adds a package with a known HIGH or CRITICAL advisory, or a
      # license the book's MIT code cannot ship with.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure

  infrastructure:
    name: Infrastructure (Bicep build and lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The linter rules are in infra/bicepconfig.json; a warning there is an error here.
      - name: Build and lint the templates
        run: |
          az bicep install
          az bicep version
          for file in infra/main.bicep infra/entra/app-registration.bicep; do
            echo "::group::$file"
            az bicep build --file "$file" --stdout > /dev/null 2> lint.txt || { cat lint.txt; exit 1; }
            cat lint.txt
            if grep -q -i "warning" lint.txt; then echo "::error file=$file::Bicep linter warnings"; exit 1; fi
            echo "::endgroup::"
          done
          echo "Resources in main.bicep (compiled): $(az bicep build --file infra/main.bicep --stdout | jq '[.. | objects | select(has("type") and has("apiVersion"))] | length')" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate the parameters file
        run: jq -e '.parameters | has("environmentName") and has("apiClientId")' infra/main.parameters.json

  container:
    name: Container image (build, scan, SBOM, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_PASSWORD: priorauthbot-ci
          POSTGRES_DB: priorauthbot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PRIORAUTHBOT_TEST_REPORTS: ${{ github.workspace }}/eval-reports
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Build the images
        run: |
          rev="${GITHUB_SHA::7}"
          start=$(date +%s)
          docker build -f src/PriorAuthBot.Api/Dockerfile --build-arg REVISION="$rev" -t priorauthbot-api:ci .
          docker build -f eval/PriorAuthBot.Eval/Dockerfile -t priorauthbot-eval:ci .
          mkdir -p eval-reports
          {
            echo "## Container images (chapter 14)"
            echo
            echo "| Image | Size (MB) |"
            echo "|---|---:|"
            for i in priorauthbot-api:ci priorauthbot-eval:ci; do
              echo "| $i | $(( $(docker image inspect "$i" --format '{{.Size}}') / 1000000 )) |"
            done
            echo
            echo "Build time: $(( $(date +%s) - start )) s"
          } > eval-reports/container-images.md

      - name: Scan the images (HIGH or CRITICAL with a fix fails)
        run: |
          for i in priorauthbot-api:ci priorauthbot-eval:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/out \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --format json --output "/out/trivy-${i%%:*}.json" --no-progress "$i"
            counts=$(jq -r '[.Results[]?.Vulnerabilities[]?] | group_by(.Severity) | map("\(.[0].Severity)=\(length)") | join(", ")' "trivy-${i%%:*}.json")
            fixable=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != "")] | length' "trivy-${i%%:*}.json")
            echo "| $i | ${counts:-none} | $fixable |" >> trivy.md
            [ "$fixable" = 0 ] || failed=1
          done
          { echo; echo "| Image | Vulnerabilities by severity | HIGH or CRITICAL with a fix |"; echo "|---|---|---:|"; cat trivy.md; } >> eval-reports/container-images.md
          exit ${failed:-0}

      - name: Software bill of materials
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/out \
            anchore/syft:v1.57.1@sha256:03215d0e98b661d0ecbc8575dbc14d65be1743b5de5df6410aecb7e80f95b060 \
            priorauthbot-api:ci -o spdx-json=/out/sbom.spdx.json
          { echo; echo "SBOM (SPDX) packages in the API image: $(jq '.packages | length' sbom.spdx.json)";
            echo "NuGet packages: $(jq '[.packages[] | select((.externalRefs // []) | map(.referenceLocator) | any(startswith("pkg:nuget")))] | length' sbom.spdx.json)"; } >> eval-reports/container-images.md

      - name: Install Ollama with the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.40.16 sh
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          ollama pull nomic-embed-text:v1.5

      # The image as it runs in Azure (Production, Entra sign-in, PostgreSQL for the vectors, the
      # audit log, and the ledger), except that PostgreSQL takes a password from an environment
      # variable and the model is local. The startup checks run for real: a missing setting stops it.
      - name: Run the container in Production
        run: |
          docker run -d --name api --network host \
            -e ASPNETCORE_HTTP_PORTS=8080 \
            -e Postgres__Authentication=Password \
            -e "ConnectionStrings__priorauthbot=Host=localhost;Database=priorauthbot;Username=postgres;Password=priorauthbot-ci" \
            -e Auth__Mode=Entra \
            -e Auth__JwtBearer__Authority=https://login.microsoftonline.com/00000000-0000-0000-0000-000000000001/v2.0 \
            -e Auth__JwtBearer__Audience=api://priorauthbot \
            -e Tools__Downstream__ClientId=22222222-2222-2222-2222-222222222222 \
            -e Usage__Ledger=Postgres -e Usage__CreateSchema=true \
            -e Audit__Store=Postgres -e Audit__CreateSchema=true \
            -e VectorStore__Provider=Postgres \
            -e AI__Provider=Ollama -e AI__Ollama__Endpoint=http://localhost:11434 \
            priorauthbot-api:ci
          # Cold start: from docker run to the readiness probe answering 200 (ingestion done, PostgreSQL up).
          start=$(date +%s.%N)
          for i in $(seq 1 600); do
            curl -sf -o /dev/null http://localhost:8080/health/ready && break
            sleep 0.5
          done
          ready=$(awk -v a="$start" -v b="$(date +%s.%N)" 'BEGIN { print b - a }')
          docker ps -a
          printf '\nCold start to ready: %.1f s\nAPI container memory after start: %s\n' "$ready" "$(docker stats --no-stream --format '{{.MemUsage}}' api)" >> eval-reports/container-images.md

      - name: Smoke test the running container
        run: |
          dotnet run --project eval/PriorAuthBot.Eval --configuration Release \
            -- --smoke http://localhost:8080/ --expect-revision "${GITHUB_SHA::7}" --wait 600 --out eval-reports

      - name: Container logs
        if: always()
        run: |
          docker logs api 2>&1 | tail -n 200 || true
          docker stats --no-stream api || true

      - name: Add the reports to the job summary
        if: always()
        run: |
          cat eval-reports/*.md || true
          cat eval-reports/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  model-canary:
    # Chapter 14: what the canary gate does with a candidate model, on a model we know is weaker.
    # The deploy pipeline runs the same suite against a new Azure OpenAI deployment before any user
    # traffic reaches it; here a smaller Ollama model stands in for "the new version". The job is
    # expected to report a failed gate, so its verdict is recorded rather than failing CI.
    name: Model canary (candidate model against the baselines)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PRIORAUTHBOT_TEST_OLLAMA: http://localhost:11434
      PRIORAUTHBOT_TEST_CHAT_MODEL: llama3.2:1b
      PRIORAUTHBOT_TEST_EMBEDDING_MODEL: nomic-embed-text:v1.5
      PRIORAUTHBOT_TEST_JUDGE_MODEL: qwen2.5:7b
      PRIORAUTHBOT_TEST_REPORTS: ${{ github.workspace }}/eval-reports/canary
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Install Ollama and pull the models
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.40.16 sh
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          ollama pull "$PRIORAUTHBOT_TEST_EMBEDDING_MODEL"
          ollama pull "$PRIORAUTHBOT_TEST_CHAT_MODEL"
          ollama pull "$PRIORAUTHBOT_TEST_JUDGE_MODEL"

      - name: Eval and red-team gates on the candidate model
        id: gate
        continue-on-error: true
        run: >-
          dotnet run --project eval/PriorAuthBot.Eval --configuration Release
          -- --provider Ollama --answers --redteam --out eval-reports/canary --execution canary-${{ github.sha }}

      - name: Gate verdict
        if: always()
        run: |
          echo "Candidate llama3.2:1b gate: ${{ steps.gate.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"
          cat eval-reports/canary/*.md || true
          cat eval-reports/canary/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: model-canary-reports
          path: eval-reports/canary/

  # ---- Chapter 15: changing models safely.

  local-model:
    # A candidate model that runs inside the eval's own process with ONNX Runtime GenAI, downloaded
    # from Hugging Face and checked file by file against models.lock.json, then held to the current
    # model's bar: the same golden set, judge, embeddings, and red-team attacks, gated against the
    # Ollama baselines. Its verdict is recorded rather than failing CI: whether to switch is a decision
    # for a person, with this job's report and the comparison below as the evidence.
    name: Local model (ONNX Runtime GenAI) against the current baselines
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PRIORAUTHBOT_TEST_OLLAMA: http://localhost:11434
      PRIORAUTHBOT_TEST_EMBEDDING_MODEL: nomic-embed-text:v1.5
      PRIORAUTHBOT_TEST_JUDGE_MODEL: qwen2.5:7b
      PRIORAUTHBOT_TEST_ONNX_MODEL_ID: phi-4-mini-instruct-onnx-cpu-int4
      PRIORAUTHBOT_TEST_ONNX_MODEL: ${{ github.workspace }}/models/phi-4-mini-instruct-onnx-cpu-int4
      PRIORAUTHBOT_TEST_REPORTS: ${{ github.workspace }}/eval-reports/local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Free disk space for the models
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift

      # A model that is not pinned yet is downloaded at the current commit, and its hashes are
      # printed as a lock entry to review and commit. A pinned one must match file for file.
      - name: Download the model and check it against models.lock.json
        run: |
          python3 scripts/get-model.py "$PRIORAUTHBOT_TEST_ONNX_MODEL_ID" "$PRIORAUTHBOT_TEST_ONNX_MODEL" --record
          git diff models.lock.json || true
          du -sh "$PRIORAUTHBOT_TEST_ONNX_MODEL"
          dotnet run --project eval/PriorAuthBot.Eval --configuration Release -- --verify-models --onnx "$PRIORAUTHBOT_TEST_ONNX_MODEL" --require-license

      - name: Install Ollama for the embeddings and the judge
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.40.16 sh
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          ollama pull "$PRIORAUTHBOT_TEST_EMBEDDING_MODEL"
          ollama pull "$PRIORAUTHBOT_TEST_JUDGE_MODEL"
          free -h

      - name: Eval and red-team gates on the local model, against the Ollama baselines
        id: gate
        continue-on-error: true
        run: >-
          dotnet run --project eval/PriorAuthBot.Eval --configuration Release
          -- --provider OnnxGenAI --baseline-provider Ollama --answers --redteam --latency 8
          --out eval-reports/local --execution local-${{ github.sha }}

      - name: Gate verdict
        if: always()
        run: |
          echo "Candidate $PRIORAUTHBOT_TEST_ONNX_MODEL_ID gate against the Ollama baselines: ${{ steps.gate.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"
          cat eval-reports/local/*.md || true
          cat eval-reports/local/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: local-model-reports
          path: eval-reports/local/

  model-comparison:
    # The current model (the RAG eval job) and the candidate side by side: every metric with its
    # change and a verdict at the gate's tolerances, latency and cost, and each model's provenance
    # from models.lock.json. The evidence a model upgrade's pull request carries.
    name: Model comparison (current and candidate)
    needs: [rag-eval, local-model]
    if: always() && needs.rag-eval.result != 'skipped' && needs.local-model.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rag-eval-reports
          path: current

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: local-model-reports
          path: candidate

      - name: Compare
        run: |
          dotnet run --project eval/PriorAuthBot.Eval --configuration Release \
            -- --compare current/eval-summary-ollama.json candidate/eval-summary-onnxgenai.json --out eval-reports
          cat eval-reports/model-comparison.md >> "$GITHUB_STEP_SUMMARY"
