# Local infrastructure for PriorAuthBot: PostgreSQL with pgvector, and Ollama for local models.
# Nothing here leaves your machine. The .NET Aspire AppHost (src/PriorAuthBot.AppHost, chapter 1)
# runs the same containers and the API together; this file is for readers without Aspire.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull nomic-embed-text:v1.5
#   docker compose exec ollama ollama pull llama3.2:3b
#   docker compose exec ollama ollama pull qwen2.5vl:3b    (chapter 4: scans and intake forms)
#
# Chapter 6's second vector store is optional: docker compose --profile qdrant up -d
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: priorauthbot
      POSTGRES_PASSWORD: priorauthbot-dev
      POSTGRES_DB: priorauthbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro

  ollama:
    image: ollama/ollama:0.40.16
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  qdrant:
    image: qdrant/qdrant:v1.18.2
    profiles: [qdrant]
    ports:
      - "127.0.0.1:6333:6333"   # REST API and dashboard
      - "127.0.0.1:6334:6334"   # gRPC, which the .NET client uses
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  ollama-models:
  qdrant-data:
