# Local infrastructure for PriorAuthBot: PostgreSQL with pgvector, and Ollama for local models.
# Nothing here leaves your machine. Chapter 1 replaces this file with a .NET Aspire AppHost.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull nomic-embed-text:v1.5
#   docker compose exec ollama ollama pull llama3.2:3b
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: priorauthbot
      POSTGRES_PASSWORD: priorauthbot-dev
      POSTGRES_DB: priorauthbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro

  ollama:
    image: ollama/ollama:0.40.16
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  postgres-data:
  ollama-models:
